    <!-- ログイン -->
    <div class="container mt-5 mb-5">

        <div class="row justify-content-center">

            <div class="col-11 col-sm-10 col-md-6 col-lg-5">

                <div class="card shadow-sm rounded-4 p-4 border-0">

                    <div class="text-center mb-4">
                        <i class="bi bi-person-circle fs-1 text-success"></i>
                        <h2 class="fw-bold mt-2 brown-color">ログイン</h2>
                        <p class="text-muted mb-0">
                            PetLifeへようこそ
                        </p>
                    </div>

                    <!-- ログインフォーム -->
                    <form class="px-2 px-md-4">

                        <div class="form-floating mb-3">
                            <input type="email" class="form-control login-input" placeholder="example@email.com">
                            <label class="form-label fs-6 text-secondary">メールアドレス</label>
                        </div>

                        <div class="form-floating mb-3">
                            <input type="password" class="form-control" placeholder="••••••••">
                            <label class="form-label fs-6 text-secondary">パスワード</label>
                        </div>

                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox">
                            <label class="form-check-label text-secondary" for="remember">
                                ログイン状態を保持する
                            </label>
                        </div>

                        <div class="d-grid mb-3 p-1 p-md-3">
                            <a href="index.html" type="submit" class="btn btn-success rounded-pill fw-bold">
                                ログイン
                            </a>
                        </div>

                        <div class="text-center">
                            <a href="#" class="text-decoration-none small">
                                パスワードを忘れた方
                            </a>
                            <div class="mt-2">
                                <span class="small text-muted">
                                    アカウントをお持ちでない方は
                                    <a href="pet-new-register.html" class="fw-bold text-success text-decoration-none">
                                        新規登録
                                    </a>
                                </span>
                            </div>
                        </div>

                    </form>
